server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # GÜVENLİK — $proxy_add_x_forwarded_for KULLANMAYIN: istemciden gelen
        # sahte bir X-Forwarded-For zincire eklenir ve TRUST_PROXY=true ile
        # birlikte NETWORK_ALLOWED_CIDRS kısıtlamasının atlatılmasına yol
        # açar (bkz. KURULUM.md bölüm 6). $remote_addr, Nginx'in gerçekten
        # gördüğü bağlantıyı kullanır.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
