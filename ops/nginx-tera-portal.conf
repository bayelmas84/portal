# /etc/nginx/sites-available/tera-portal
# TLS sonlandırma ve ters vekil. Uygulama yalnızca 127.0.0.1:8080 dinler.

limit_req_zone $binary_remote_addr zone=portal_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=portal_api:10m rate=120r/m;

server {
    listen 80;
    server_name portal.terayatirim.com.tr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name portal.terayatirim.com.tr;

    ssl_certificate     /etc/ssl/certs/portal.terayatirim.crt;
    ssl_certificate_key /etc/ssl/private/portal.terayatirim.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    server_tokens off;
    client_max_body_size 30m;      # UPLOAD_MAX_MB + pay

    access_log /var/log/nginx/tera-portal.access.log;
    error_log  /var/log/nginx/tera-portal.error.log warn;

    location /api/auth/login {
        limit_req zone=portal_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        limit_req zone=portal_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }
}
