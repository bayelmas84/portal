# Konteynerle kurulum (isteğe bağlı). Doğrudan sunucuya kurulum için KURULUM.md yeterlidir.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-tera_portal}
      POSTGRES_USER: ${DB_USER:-tera_portal}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD zorunlu}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports: []                       # dışarıya açılmaz
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tera_portal}"]
      interval: 10s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: ops/Dockerfile
    env_file: ../.env
    environment:
      DB_HOST: db
    depends_on:
      db: { condition: service_healthy }
    ports:
      - "127.0.0.1:8080:8080"       # yalnızca yerel; TLS için önünde Nginx olmalı
    read_only: true                  # kök dosya sistemi salt okunur
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - uploads:/var/lib/tera-portal/uploads
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    user: "node"
    restart: unless-stopped

volumes:
  db-data:
  uploads:
